# ═══════════════════════════════════════════════════════════════
# E2E Tests — Playwright
# Runs on every PR to develop or main.
# Spins up PostgreSQL + Redis as service containers, starts the
# API and Web in test mode, then runs all Playwright specs.
# ═══════════════════════════════════════════════════════════════
name: E2E Tests

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rkf
          POSTGRES_PASSWORD: rkftest
          POSTGRES_DB: rkf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rkf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rkf:rkftest@localhost:5432/rkf_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-test-secret-do-not-use-in-production
      VITE_API_URL: http://localhost:4000

    steps:
      # ── Setup ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build web ────────────────────────────────────────────
      - name: Build API
        run: pnpm --filter @rkf/api build

      - name: Build web PWA
        run: pnpm --filter @rkf/web build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      # ── Playwright browsers ──────────────────────────────────
      - name: Install Playwright browsers
        run: pnpm --filter @rkf/web exec playwright install --with-deps chromium webkit

      # ── Run E2E tests ────────────────────────────────────────
      - name: Run Playwright tests
        run: pnpm --filter @rkf/web test:e2e --project local-full
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          VITE_WS_URL: ws://localhost:4000/ws
          # Credentials from CLAUDE.md dev seed
          E2E_FIRST_AIDER_CODE: "123456"
          E2E_SICK_BAY_CODE: "654321"
          E2E_ADMIN_EMAIL: admin@rkf.no
          E2E_ADMIN_PASSWORD: admin123

      # ── Artifacts ────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
