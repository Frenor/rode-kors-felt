# ═══════════════════════════════════════════════════════════════
# E2E Tests — Playwright (local-full project)
# Runs on every PR to develop or main.
# Spins up PostgreSQL + Redis as service containers; Playwright
# starts the API and Web dev servers itself via webServer config.
# ═══════════════════════════════════════════════════════════════
name: E2E Tests

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rkf_dev
          POSTGRES_PASSWORD: rkf_dev_password
          POSTGRES_DB: rkf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rkf_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://rkf_dev:rkf_dev_password@localhost:5432/rkf
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-test-secret-do-not-use-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @rkf/web exec playwright install --with-deps chromium

      - name: Prepare Playwright artifact directories
        run: |
          rm -rf apps/web/playwright-report/local-full apps/web/test-results/local-full
          mkdir -p apps/web/playwright-report apps/web/test-results

      - name: Run Playwright tests
        run: pnpm --filter @rkf/web test:e2e --project local-full
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/local-full
          PLAYWRIGHT_TEST_RESULTS_DIR: test-results/local-full

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-full-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/playwright-report/local-full/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test traces (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-full-playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/local-full/
          if-no-files-found: ignore
          retention-days: 7
