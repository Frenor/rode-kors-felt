name: Deploy — Staging

on:
  # push:        # PAUSED — restore to auto-deploy on develop
  #   branches: [develop]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false  # never cancel a running deploy

jobs:
  # Gate: CI must be green before we deploy
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const ciRuns = checks.check_runs.filter(r =>
              r.name !== 'Wait for CI' && r.status !== 'completed'
            );
            if (ciRuns.length > 0) {
              core.info(`Waiting on: ${ciRuns.map(r => r.name).join(', ')}`);
            }

