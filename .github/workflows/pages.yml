name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          # Repo name becomes the sub-path on GitHub Pages:
          # https://<org>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO_MODE: "true"
        run: pnpm --filter @rkf/web build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Publish to Pages
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  demo-e2e:
    name: Demo E2E
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @rkf/web exec playwright install --with-deps chromium

      - name: Prepare Playwright artifact directories
        run: |
          rm -rf apps/web/playwright-report/pages-demo apps/web/test-results/pages-demo
          mkdir -p apps/web/playwright-report apps/web/test-results

      - name: Verify deployed Pages preview is reachable
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$PREVIEW_URL"
          for i in {1..12}; do
            if curl -fsSL "$PREVIEW_URL" | grep -q '<div id="root"></div>'; then
              echo "Preview reachable and content visible"
              exit 0
            fi
            echo "Preview not ready yet (attempt $i), retrying..."
            sleep 10
          done
          echo "Preview URL did not become ready in time: $PREVIEW_URL"
          exit 1

      - name: Run demo Playwright checks
        run: pnpm --filter @rkf/web test:e2e --project pages-demo
        env:
          PLAYWRIGHT_DEMO_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/pages-demo
          PLAYWRIGHT_TEST_RESULTS_DIR: test-results/pages-demo

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-demo-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/playwright-report/pages-demo/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-demo-playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/pages-demo/
          if-no-files-found: ignore
          retention-days: 7
