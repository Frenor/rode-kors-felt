name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          # Repo name becomes the sub-path on GitHub Pages:
          # https://<org>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO_MODE: "true"
        run: pnpm --filter @rkf/web build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    name: Publish to Pages
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  demo-e2e:
    name: Demo E2E
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @rkf/web exec playwright install --with-deps chromium

      - name: Prepare Playwright artifact directories
        run: |
          rm -rf apps/web/playwright-report/pages-demo apps/web/test-results/pages-demo
          mkdir -p apps/web/playwright-report apps/web/test-results

      - name: Verify deployed Pages preview is reachable
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$PREVIEW_URL"
          for i in {1..12}; do
            if curl -fsSL "$PREVIEW_URL" | grep -q '<div id="root"></div>'; then
              echo "Preview reachable and content visible"
              exit 0
            fi
            echo "Preview not ready yet (attempt $i), retrying..."
            sleep 10
          done
          echo "Preview URL did not become ready in time: $PREVIEW_URL"
          exit 1

      - name: Run demo Playwright checks
        run: pnpm --filter @rkf/web test:e2e --project pages-demo
        env:
          PLAYWRIGHT_DEMO_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/pages-demo
          PLAYWRIGHT_TEST_RESULTS_DIR: test-results/pages-demo

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-demo-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/playwright-report/pages-demo/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-demo-playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/pages-demo/
          if-no-files-found: ignore
          retention-days: 7
