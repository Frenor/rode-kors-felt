name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: rkf
        run: pnpm --filter @rkf/web build
        env:
          VITE_BASE_PATH: /rode-kors-felt/
          # Set this secret in repo Settings → Secrets if you have a running API:
          # VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Copy index.html → 404.html (SPA routing)
        run: cp rkf/apps/web/dist/index.html rkf/apps/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: rkf/apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
