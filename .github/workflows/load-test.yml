name: API Load Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: Read-Only API Load Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rkf
          POSTGRES_USER: rkf_dev
          POSTGRES_PASSWORD: rkf_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rkf_dev:rkf_dev_password@127.0.0.1:5432/rkf
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: load-test-secret
      CORS_ORIGIN: http://localhost:3000
      LOAD_TEST_BASE_URL: http://127.0.0.1:4000
      LOAD_TEST_DURATION_SECONDS: "10"
      LOAD_TEST_CONNECTIONS: "20"
      LOAD_TEST_P95_MAX_MS: "500"
      LOAD_TEST_RPS_MIN: "20"
      LOAD_TEST_ERROR_RATE_MAX: "0.02"
      LOAD_TEST_REQUIRE_AUTH_SCENARIOS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @rkf/api build

      - name: Start API
        run: |
          pnpm --filter @rkf/api start > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API health
        run: |
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:4000/health >/dev/null; do sleep 1; done'

      - name: Run load test
        run: pnpm --filter @rkf/api test:load

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" || true
          fi

      - name: Upload load artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-load-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            api.log
          if-no-files-found: ignore
          retention-days: 7
