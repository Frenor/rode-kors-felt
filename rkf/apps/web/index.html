<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages SPA: decode redirect encoded by 404.html -->
    <script>
      (function () {
        var p = window.location.search.match(/[?&]p=([^&]+)/);
        if (p) {
          var base = window.location.pathname.split('/').slice(0, 2).join('/');
          window.history.replaceState(null, '', base + '/' + decodeURIComponent(p[1]));
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E8112D" />
    <meta name="description" content="Rødt Kors Felt — Medisinsk hendelsessystem" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>RKF — Rødt Kors Felt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
