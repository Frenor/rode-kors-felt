# ═══════════════════════════════════════════════════════════════
# Reusable deployment workflow — called by deploy-staging and
# deploy-prod. Builds, pushes, migrates, and deploys both
# containers to AWS ECS Fargate. Invalidates CloudFront for web.
# ═══════════════════════════════════════════════════════════════
name: _Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "staging | production"
      image_tag:
        required: true
        type: string
        description: "Docker image tag (git SHA)"
      aws_region:
        required: false
        type: string
        default: eu-central-1
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      ECS_CLUSTER:
        required: true
      API_ECS_SERVICE:
        required: true
      MIGRATION_TASK_FAMILY:
        required: true
      MIGRATION_SUBNET:
        required: true
      MIGRATION_SECURITY_GROUP:
        required: true
      CF_DISTRIBUTION_ID:
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      AWS_REGION: ${{ inputs.aws_region }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── AWS credentials ──────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── ECR login ────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & push API image ───────────────────────────────
      - name: Build and push API image
        run: |
          docker build \
            -f infra/docker/Dockerfile.api \
            -t $ECR_REGISTRY/rkf-api:$IMAGE_TAG \
            -t $ECR_REGISTRY/rkf-api:${{ inputs.environment }}-latest \
            .
          docker push $ECR_REGISTRY/rkf-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/rkf-api:${{ inputs.environment }}-latest

      # ── Build & push Web image ───────────────────────────────
      - name: Build and push Web image
        run: |
          docker build \
            -f infra/docker/Dockerfile.web \
            -t $ECR_REGISTRY/rkf-web:$IMAGE_TAG \
            -t $ECR_REGISTRY/rkf-web:${{ inputs.environment }}-latest \
            .
          docker push $ECR_REGISTRY/rkf-web:$IMAGE_TAG
          docker push $ECR_REGISTRY/rkf-web:${{ inputs.environment }}-latest

      # ── Database migration ───────────────────────────────────
      # Run Drizzle migrations as a one-off ECS task BEFORE the
      # new API version starts. Wait for completion — if this
      # fails the deployment stops here and ECS is untouched.
      - name: Run database migrations
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --task-definition "${{ secrets.MIGRATION_TASK_FAMILY }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ secrets.MIGRATION_SUBNET }}],
              securityGroups=[${{ secrets.MIGRATION_SECURITY_GROUP }}],
              assignPublicIp=DISABLED
            }" \
            --overrides "{
              \"containerOverrides\": [{
                \"name\": \"migrate\",
                \"environment\": [{
                  \"name\": \"IMAGE_TAG\",
                  \"value\": \"$IMAGE_TAG\"
                }]
              }]
            }" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task ARN: $TASK_ARN"

          # Wait up to 10 minutes for migration to complete
          aws ecs wait tasks-stopped \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --tasks "$TASK_ARN"

          # Check exit code — fail the job if migration failed
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Migration completed successfully"

      # ── Deploy API to ECS ────────────────────────────────────
      - name: Update API ECS service
        id: ecs-deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          cluster: ${{ secrets.ECS_CLUSTER }}
          service: ${{ secrets.API_ECS_SERVICE }}
          task-definition: ${{ secrets.API_ECS_SERVICE }}
          container-name: api
          image: ${{ env.ECR_REGISTRY }}/rkf-api:${{ env.IMAGE_TAG }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      # ── Post-deploy health check ─────────────────────────────
      - name: Health check
        run: |
          # Allow a moment for load balancer to route to new tasks
          sleep 15
          STATUS=$(aws ecs describe-services \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.API_ECS_SERVICE }}" \
            --query 'services[0].deployments[?status==`PRIMARY`].rolloutState' \
            --output text)
          echo "Deployment rollout state: $STATUS"
          if [ "$STATUS" != "COMPLETED" ]; then
            echo "Deployment did not stabilize cleanly"
            exit 1
          fi

      # ── Invalidate CloudFront (web PWA) ──────────────────────
      - name: Invalidate CloudFront distribution
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}" \
            --paths "/*"

      # ── Summary ──────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment to ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API image | \`${{ env.ECR_REGISTRY }}/rkf-api:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web image | \`${{ env.ECR_REGISTRY }}/rkf-web:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ECS cluster | \`${{ secrets.ECS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
