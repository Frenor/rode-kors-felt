# ═══════════════════════════════════════════════════════════════
# Deploy — Production
# Triggered on push to main. Requires manual approval via the
# GitHub "production" environment protection rule before deploying.
# ═══════════════════════════════════════════════════════════════
name: Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual production deploy"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a running deploy

jobs:
  # Validate that the exact SHA being promoted was tested on staging.
  # This checks that the CI workflow passed for this commit.
  verify-staging:
    name: Verify staging CI passed
    runs-on: ubuntu-latest
    steps:
      - name: Check CI workflow status for this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              status: 'success',
            });
            const ciRun = runs.workflow_runs.find(r => r.name === 'CI');
            if (!ciRun) {
              core.setFailed(
                `No successful CI run found for SHA ${context.sha}. ` +
                `Do not deploy to production without a green CI run.`
              );
            } else {
              core.info(`CI run ${ciRun.id} passed for ${context.sha}`);
            }

  deploy:
    name: Production deploy
    needs: verify-staging
    uses: ./.github/workflows/_deploy.yml
    # The "production" GitHub environment must have:
    #   - Required reviewers (at least 1 approver)
    #   - Deployment branch restriction: main only
    # Configure at: Settings → Environments → production
    with:
      environment: production
      image_tag: ${{ github.sha }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECS_CLUSTER: ${{ secrets.PROD_ECS_CLUSTER }}
      API_ECS_SERVICE: ${{ secrets.PROD_API_ECS_SERVICE }}
      MIGRATION_TASK_FAMILY: ${{ secrets.PROD_MIGRATION_TASK_FAMILY }}
      MIGRATION_SUBNET: ${{ secrets.PROD_MIGRATION_SUBNET }}
      MIGRATION_SECURITY_GROUP: ${{ secrets.PROD_MIGRATION_SECURITY_GROUP }}
      CF_DISTRIBUTION_ID: ${{ secrets.PROD_CF_DISTRIBUTION_ID }}
