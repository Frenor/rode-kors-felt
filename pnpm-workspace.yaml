# Supply-chain hardening settings flagged by Semgrep (minimumReleaseAge, trustPolicy,
# blockExoticSubdeps) only exist in pnpm 10; this workspace is pinned to pnpm 9.15.4 and
# would silently ignore them. Re-evaluate when upgrading pnpm (tracked in PLAN.md).
packages:  # nosemgrep: package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies, package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age, package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy
  - "apps/*"
  - "packages/*"
